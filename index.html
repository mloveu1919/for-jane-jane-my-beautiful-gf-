<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffc0cb;
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 500px;
            height: 350px;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-shadow: 0 30px 50px rgba(0,0,0,0.2);
            border-radius: 20px;
            padding-top: 20px;
        }
        .emoji {
            font-size: 70px;
            margin-bottom: 10px;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
        .container h1 {
            font-size: 2em;
            color: #444;
            margin-bottom: 30px;
        }
        .container .btn {
            position: relative;
            display: flex;
            gap: 40px;
        }
        .container .btn a {
            position: relative;
            text-decoration: none;
            padding: 12px 30px;
            background: #fff;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 1px;
            color: #444;
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .container .btn a#yes {
            background: #00ff55;
            color: #fff;
            box-shadow: 0 10px 20px rgba(0,255,85,0.4);
        }
        .container .btn a#no {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 10px 20px rgba(255,0,85,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🐹 🥺</div>
        <h1>Do you love me?</h1>
        <div class="btn">
            <a href="#" id="yes">YES</a>
            <a href="#" id="no">NO</a>
        </div>
    </div>
    <script>
        const btn = document.getElementById('no');
        btn.addEventListener('mouseover', function () {
            this.style.position = 'absolute';
            this.style.top = Math.random() * 70 + '%';
            this.style.left = Math.random() * 70 + '%';
        });
        
        document.getElementById('yes').addEventListener('click', function() {
            alert('Yayyyyyy! ❤️ Bong slanh oun Jane!');
        });
    </script>
</body>
</html>
